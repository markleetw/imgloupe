<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ImgLoupe</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main class="popup">
      <header>
        <img class="brand-icon" src="../../assets/icon48.png" width="44" height="44" alt="ImgLoupe">
        <div class="brand-copy">
          <h1 id="name">ImgLoupe</h1>
          <p class="tagline" data-i18n="popupTagline"></p>
        </div>
        <span id="version" data-i18n-aria-label="popupVersionLabel"></span>
      </header>
      <div class="connection" data-state="checking">
        <span class="connection-dot" aria-hidden="true"></span>
        <span id="connection-status" aria-live="polite" data-i18n="popupChecking"></span>
        <span class="connection-caption" data-i18n="popupCurrentCaption"></span>
      </div>
      <section class="download-section" data-i18n-aria-label="popupDownloadSection">
        <button id="imgloupe-batch-export-btn" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/></svg>
          <span data-i18n="popupExportButton"></span>
        </button>
        <p id="imgloupe-batch-export-status" role="status" aria-live="polite" data-i18n="popupExportIdle"></p>
      </section>
      <section class="usage" data-i18n-aria-label="popupUsageSection">
        <h2 data-i18n="popupUsageTitle"></h2>
        <p data-i18n="popupUsageBody"></p>
        <p class="actions" data-i18n="popupUsageActions"></p>
      </section>
      <div class="local-ocr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4M9 10l2 2 4-4"/></svg>
        <span data-i18n="popupOcrTitle"></span><span class="language" data-i18n="popupOcrLanguages"></span>
      </div>
      <footer>
        <a href="https://github.com/markleetw/imgloupe/issues" target="_blank" rel="noopener noreferrer" data-i18n="popupReportIssue"></a>
        <a href="https://github.com/markleetw/imgloupe" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="privacy.html" target="_blank" rel="noopener noreferrer" data-i18n="popupPrivacy"></a>
      </footer>
    </main>
  </body>
</html>
