# Monthly update PRs for the pinned workflow actions and npm packages. CI must
# pass before merging; OCR and model files in vendor/ are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
