name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify tag matches manifest
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./manifest.json").version) process.exit(1)'
      - run: npm test
      - run: npm run check-syntax
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: node scripts/package.mjs && node scripts/verify-package.mjs
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ImgLoupe ${{ github.ref_name }}
          files: build/imgloupe-${{ github.ref_name }}.zip
          generate_release_notes: true
